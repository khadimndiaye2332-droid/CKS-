<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MonBudget">

    <title>MonBudget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "Helvetica Neue", Arial, sans-serif;
            background: #f5f6fa;
            color: #111827;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 20px 16px 100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 4px 0 0;
            color: #6b7280;
        }

        .balance {
            background: #111827;
            color: white;
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
        }

        .balance small {
            color: #d1d5db;
        }

        .balance h2 {
            font-size: 38px;
            margin: 8px 0;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        .card small {
            color: #6b7280;
        }

        .card strong {
            display: block;
            margin-top: 7px;
            font-size: 20px;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title h3 {
            margin: 0;
            font-size: 20px;
        }

        .transactions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .transaction {
            background: white;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.04);
        }

        .icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            background: #f3f4f6;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-info strong {
            display: block;
        }

        .transaction-info small {
            color: #6b7280;
        }

        .amount {
            font-weight: bold;
        }

        .delete {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 10px;
            padding: 8px;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            color: #6b7280;
        }

        .add-button {
            position: fixed;
            right: 20px;
            bottom: 25px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: none;
            background: #111827;
            color: white;
            font-size: 32px;
            box-shadow: 0 8px 25px rgba(0,0,0,.25);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            align-items: flex-end;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 25px 25px 0 0;
            padding: 25px;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .buttons button {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
        }

        .cancel {
            background: #e5e7eb;
        }

        .save {
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div>
            <h1>MonBudget 💰</h1>
            <p>Gère ton argent simplement</p>
        </div>
    </header>

    <section class="balance">
        <small>Solde disponible</small>
        <h2 id="balance">0,00 €</h2>
        <span id="message">Commence à enregistrer tes opérations.</span>
    </section>

    <section class="cards">

        <div class="card">
            <small>Revenus</small>
            <strong class="income" id="income">0,00 €</strong>
        </div>

        <div class="card">
            <small>Dépenses</small>
            <strong class="expense" id="expenses">0,00 €</strong>
        </div>

    </section>

    <div class="section-title">
        <h3>Mes opérations</h3>
    </div>

    <div id="transactions" class="transactions"></div>

</div>

<button class="add-button" onclick="openModal()">+</button>

<div id="modal" class="modal">

    <div class="modal-content">

        <h2>Nouvelle opération</h2>

        <label>Type</label>
        <select id="type">
            <option value="expense">Dépense</option>
            <option value="income">Revenu</option>
        </select>

        <label>Description</label>
        <input
            id="title"
            type="text"
            placeholder="Ex : Courses"
        >

        <label>Montant (€)</label>
        <input
            id="amount"
            type="number"
            step="0.01"
            placeholder="Ex : 25"
        >

        <label>Catégorie</label>
        <select id="category">
            <option value="🍔 Alimentation">🍔 Alimentation</option>
            <option value="🚗 Transport">🚗 Transport</option>
            <option value="🏠 Logement">🏠 Logement</option>
            <option value="🛍️ Shopping">🛍️ Shopping</option>
            <option value="🎮 Loisirs">🎮 Loisirs</option>
            <option value="💡 Factures">💡 Factures</option>
            <option value="❤️ Santé">❤️ Santé</option>
            <option value="📚 Études">📚 Études</option>
            <option value="📦 Autre">📦 Autre</option>
        </select>

        <div class="buttons">
            <button class="cancel" onclick="closeModal()">
                Annuler
            </button>

            <button class="save" onclick="addTransaction()">
                Ajouter
            </button>
        </div>

    </div>

</div>

<script>

let transactions =
    JSON.parse(localStorage.getItem("monbudget")) || [];

function saveData() {
    localStorage.setItem(
        "monbudget",
        JSON.stringify(transactions)
    );
}

function formatMoney(amount) {
    return amount.toLocaleString("fr-FR", {
        style: "currency",
        currency: "EUR"
    });
}

function updateApp() {

    let income = 0;
    let expenses = 0;

    transactions.forEach(transaction => {

        if (transaction.type === "income") {
            income += transaction.amount;
        } else {
            expenses += transaction.amount;
        }

    });

    const balance = income - expenses;

    document.getElementById("income").textContent =
        formatMoney(income);

    document.getElementById("expenses").textContent =
        formatMoney(expenses);

    document.getElementById("balance").textContent =
        formatMoney(balance);

    if (balance < 0) {
        document.getElementById("message").textContent =
            "⚠️ Attention, ton solde est négatif.";
    } else if (balance === 0) {
        document.getElementById("message").textContent =
            "Commence à enregistrer tes opérations.";
    } else {
        document.getElementById("message").textContent =
            "👍 Tu es dans le positif.";
    }

    renderTransactions();
}

function renderTransactions() {

    const container =
        document.getElementById("transactions");

    container.innerHTML = "";

    if (transactions.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:40px">💰</div>
                <p>Aucune opération.</p>
                <p>Appuie sur + pour ajouter ta première opération.</p>
            </div>
        `;

        return;
    }

    transactions.forEach((transaction, index) => {

        const sign =
            transaction.type === "income" ? "+" : "-";

        const color =
            transaction.type === "income"
            ? "income"
            : "expense";

        const element = document.createElement("div");

        element.className = "transaction";

        element.innerHTML = `
            <div class="icon">
                ${transaction.category.split(" ")[0]}
            </div>

            <div class="transaction-info">
                <strong>${transaction.title}</strong>
                <small>${transaction.category}</small>
            </div>

            <div class="amount ${color}">
                ${sign}${formatMoney(transaction.amount)}
            </div>

            <button
                class="delete"
                onclick="deleteTransaction(${index})">
                🗑️
            </button>
        `;

        container.appendChild(element);
    });
}

function openModal() {

    document
        .getElementById("modal")
        .classList.add("active");

}

function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("active");

}

function addTransaction() {

    const type =
        document.getElementById("type").value;

    const title =
        document.getElementById("title").value.trim();

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const category =
        document.getElementById("category").value;

    if (!title) {
        alert("Entre une description.");
        return;
    }

    if (!amount || amount <= 0) {
        alert("Entre un montant valide.");
        return;
    }

    transactions.unshift({
        type: type,
        title: title,
        amount: amount,
        category: category,
        date: new Date().toISOString()
    });

    saveData();

    document.getElementById("title").value = "";
    document.getElementById("amount").value = "";

    closeModal();

    updateApp();
}

function deleteTransaction(index) {

    if (
        confirm("Supprimer cette opération ?")
    ) {
        transactions.splice(index, 1);

        saveData();

        updateApp();
    }
}

updateApp();

</script>

</body>
</html>
